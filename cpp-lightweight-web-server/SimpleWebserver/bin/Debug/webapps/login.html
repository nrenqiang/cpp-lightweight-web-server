<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="gbk">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/loginstyle.css">
    <title>登录页面</title>
</head>
<body>
    <img src="./imgs/girl.gif" alt="图片说明" title="girl" width="500px"">
    <form method="post" action="./Dll/LoginDll.dll">
    <div class="login-card">
        <h2 class="login-title">欢迎登录</h2>
        <p class="login-desc">欢迎回来～</p>

        <div class="input-group">
            <label>用户名/手机号</label>
            <input type="text" class="cartoon-input" name="account" placeholder="请输入账号">
        </div>

        <div class="input-group">
            <label>密码</label>
            <input type="password" class="cartoon-input" name="pwd" placeholder="请输入密码">
        </div>

        <div class="extra-row">
            <a href="./forgetpsw.html">忘记密码？</a>
        </div>

        <button type="submit" class="login-btn">立即登录</button>

        <div class="footer-text">
            还没有账号？<a href="register.html">立即注册</a>
        </div>
    </div>
</form>
<script src="./js/login_error.js"></script>
</body>
</html>
