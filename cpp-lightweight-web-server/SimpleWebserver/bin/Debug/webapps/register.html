<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/registerstyle.css">
    <title>注册页面</title>
</head>
<body>
    <form method="post" action="./Dll/LoginDll.dll" onsubmit="return validateRegister()">
    <div class="register-card">
        <h2 class="register-title">注册账号</h2>
        <p class="register-desc">欢迎加入</p>

        <input type="hidden" name="action" value="register">

        <div class="input-group">
            <label>用户名</label>
            <input type="text" name="account" id="username" class="cartoon-input" placeholder="请输入你的昵称">
        </div>

        <div class="input-group">
            <label>手机号</label>
            <input type="tel" name="phone" id="phone" class="cartoon-input" placeholder="请输入手机号">
        </div>

        <div class="input-group">
            <label>设置密码</label>
            <input type="password" name="pwd" id="password" class="cartoon-input" placeholder="请输入6-16位密码">
        </div>

        <div class="input-group">
            <label>确认密码</label>
            <input type="password" id="confirmPwd" class="cartoon-input" placeholder="请再次输入密码">
        </div>

        <button type="submit" class="register-btn">立即注册</button>

        <div class="footer-text">
            已有账号？<a href="login.html">马上登录</a>
        </div>
    </div>
    </form>
    <script src="./js/register.js"></script>
</body>
</html>
